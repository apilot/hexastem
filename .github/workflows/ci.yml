name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test + Clippy (ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      # Тесты замоканы: без сети, без GPU, без smbclient.
      - name: Run tests
        run: cargo test --locked

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
